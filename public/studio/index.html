<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Audio Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: hsl(0 0% 95%); --card: hsl(0 0% 100%); --ink: hsl(0 0% 5%);
      --muted: hsl(0 0% 40%); --accent: hsl(43 50% 55%); --line: hsl(0 0% 5%);
      --bad: hsl(0 55% 45%);
      --mono: 'Space Mono', ui-monospace, monospace;
      --head: 'Space Grotesk', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink); font-family: var(--mono);
      font-size: 16px; line-height: 1.5;
      padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { font-family: var(--head); font-weight: 700; letter-spacing: -0.02em; font-size: 1.6rem; margin: .2rem 0 1rem; }
    h2 { font-family: var(--head); font-weight: 500; font-size: 1.05rem; text-transform: uppercase; letter-spacing: .04em; margin: 1.4rem 0 .5rem; }
    #status { min-height: 1.4em; color: var(--muted); font-size: .9rem; }

    button, .btn {
      font-family: var(--mono); font-size: 1rem; min-height: 48px; padding: .6rem 1rem;
      background: var(--card); color: var(--ink); border: 2px solid var(--line);
      cursor: pointer; box-shadow: 3px 3px 0 var(--line); transition: transform .04s, box-shadow .04s;
    }
    button:active, .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--line); }
    button:disabled { opacity: .45; box-shadow: none; cursor: default; }
    .primary { background: var(--accent); font-weight: 700; width: 100%; }
    input, textarea {
      font-family: var(--mono); font-size: 16px; width: 100%; padding: .65rem .7rem;
      background: var(--card); color: var(--ink); border: 2px solid var(--line);
    }
    label { display: block; margin: .6rem 0; font-size: .85rem; color: var(--muted); }
    label input, label textarea { margin-top: .25rem; }
    a { color: var(--ink); text-decoration-thickness: 2px; }

    ul { list-style: none; padding: 0; margin: 0; }
    #cards li {
      background: var(--card); border: 3px solid var(--line); box-shadow: 4px 4px 0 var(--line);
      padding: .9rem 1rem; margin: .9rem 0; display: grid; gap: .35rem;
      grid-template-columns: 1fr auto; align-items: center;
    }
    #cards li a { font-family: var(--head); font-weight: 700; font-size: 1.15rem; text-decoration: none; grid-column: 1; }
    #cards .badge { grid-column: 1; justify-self: start; font-size: .72rem; text-transform: uppercase;
      letter-spacing: .05em; border: 2px solid var(--line); padding: .1rem .45rem; background: var(--bg); }
    #cards .badge::before { content: "■ "; color: var(--accent); }
    #cards .meta { grid-column: 1; color: var(--muted); font-size: .8rem; }
    #cards li button { grid-column: 2; grid-row: 1 / span 3; align-self: center; min-height: 44px; }
    #cards .empty { display: block; border: 2px dashed var(--line); box-shadow: none; color: var(--muted); text-align: center; }
    #new-ws { margin: 1rem 0; }

    .topbar { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: .5rem; }
    .topbar a { font-size: .9rem; }
    #savestate { margin-left: auto; font-size: .8rem; color: var(--muted); border: 2px solid var(--line); padding: .15rem .5rem; }
    #drop { border: 2px dashed var(--line); padding: 1.3rem 1rem; text-align: center; background: var(--card);
      display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: center; margin-top: .4rem; }
    #rec[data-on="1"] { background: var(--accent); animation: pulse 1.1s ease-in-out infinite; }
    @keyframes pulse { 50% { box-shadow: 3px 3px 0 var(--accent), 0 0 0 4px hsl(43 50% 55% / .4); } }
    #pending li, #notes li {
      background: var(--card); border: 2px solid var(--line); box-shadow: 3px 3px 0 var(--line);
      padding: .7rem .8rem; margin: .6rem 0;
    }
    #pending li strong, #notes li strong { font-family: var(--head); }
    #pending audio { display: block; width: 100%; margin: .5rem 0; }
    #pending li button, #notes li button { min-width: 44px; min-height: 44px; padding: .3rem .5rem; margin-right: .35rem; box-shadow: 2px 2px 0 var(--line); }
    #notes .t, #pending .err { font-size: .85rem; color: var(--muted); white-space: pre-wrap; margin-top: .4rem; }
    #pending .err { color: var(--bad); }
    #f-body { min-height: 50vh; }
    #transcribe-all, #synth, #save { margin-top: .4rem; }
    #cms-link a { display: inline-block; margin-top: .6rem; border: 2px solid var(--line); padding: .5rem .8rem; background: var(--accent); box-shadow: 3px 3px 0 var(--line); }

    #sticky {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: .6rem 1rem calc(.6rem + env(safe-area-inset-bottom));
      background: var(--bg); border-top: 3px solid var(--line); display: none;
    }
    body.sticky-on { padding-bottom: 6rem; }
    @media (max-width: 699px) {
      body.sticky-on #sticky { display: block; }
      #transcribe-all, #synth { display: none; }
    }
    @media (min-width: 700px) { #sticky { display: none !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Audio Studio</h1>
    <p id="status"></p>

    <div id="view-signin" style="display:none">
      <button id="signin" class="primary">Sign in with GitHub</button>
    </div>

    <div id="view-dashboard" style="display:none">
      <button id="new-ws" class="primary">+ New article</button>
      <ul id="cards"></ul>
    </div>

    <div id="view-workspace" style="display:none">
      <div class="topbar">
        <a href="#/">← All articles</a>
        <span id="savestate"></span>
      </div>
      <label>Title <input id="w-title" placeholder="Untitled" /></label>
      <button id="save-progress">Save progress</button>

      <div id="drop">
        <span>Drop audio, <label style="display:inline;margin:0"><input id="file" type="file" accept="audio/*" multiple hidden /><a href="#">browse</a></label>, or</span>
        <button id="rec" type="button">● Record</button>
      </div>

      <h2>To transcribe</h2>
      <ul id="pending"></ul>
      <button id="transcribe-all" class="primary" disabled>Transcribe all (0)</button>

      <h2>Notes</h2>
      <ul id="notes"></ul>
      <button id="synth" class="primary" disabled>Synthesize</button>

      <div id="preview" style="display:none">
        <h2>Draft preview</h2>
        <label>Title <input id="f-title" /></label>
        <label>Description <input id="f-desc" /></label>
        <label>Category <input id="f-cat" /></label>
        <label>Tags (comma-separated) <input id="f-tags" /></label>
        <label>Body (Markdown) <textarea id="f-body"></textarea></label>
        <button id="save" class="primary">Save draft</button>
        <p id="cms-link"></p>
      </div>
    </div>
  </div>

  <div id="sticky"><div class="wrap"><button id="primary" class="primary" disabled>Record or drop a note</button></div></div>

  <script src="studio-lib.js"></script>
  <script src="studio.js"></script>
</body>
</html>
